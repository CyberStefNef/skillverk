name: Release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the release
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          go test ./...
          go vet ./...

      - name: Build archives
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="skillverk"
            [ "$os" = windows ] && name="skillverk.exe"
            rm -rf build && mkdir build
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.buildVersion=$VERSION" \
              -o "build/$name" .
            cp LICENSE README.md build/
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/skillverk-$os-$arch.zip" .)
            else
              tar -czf "dist/skillverk-$os-$arch.tar.gz" -C build .
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
        run: gh release upload "$VERSION" dist/* --clobber
