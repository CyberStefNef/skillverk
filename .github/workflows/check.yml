name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-filesystem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build .
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install.sh
          shellcheck -s sh scripts/install.sh
      - name: Check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $path = (Resolve-Path scripts/install.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host "install.ps1 parses cleanly"
